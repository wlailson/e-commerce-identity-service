spring:
  application:
    name: Identity Service

  profiles:
    active:
      - ${APP_PROFILE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  metrics:
    tags:
      application: prometheus-grafana

  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - logfile

  endpoint:
    health:
      show-details: always

jwt:
  duration: ${JWT_DURATION:86400}

cors:
  origins: ${CORS_ORIGINS:http://localhost:8080}

server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: Identity Service

  profiles:
    active:
      - ${APP_PROFILE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  duration: ${JWT_DURATION:86400}
  private-key: ${JWT_PRIVATE_KEY:MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC4aYyIgeNOUp}
  public-key: ${JWT_PUBLIC_KEY:MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC4aYyIgeNOUpgfgft}

cors:
  origins: ${CORS_ORIGINS:http://localhost:8080}

server:
  port: ${SERVER_PORT:8080}